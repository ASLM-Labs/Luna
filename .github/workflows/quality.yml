name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/verify_syntax.py
      - run: python -m pytest -q -p no:cacheprovider --basetemp=.pytest_tmp
      - run: python -m ruff check .
      - run: python -m mypy src
      - run: python scripts/verify_phase1.py
      - run: python scripts/verify_phase2.py
      - run: python scripts/verify_phase3.py
      - run: python scripts/verify_phase4.py
      - run: python scripts/verify_phase5.py
      - run: python scripts/verify_phase6.py
      - run: python scripts/verify_phase7.py
      - run: python scripts/verify_phase8.py
      - run: python scripts/verify_phase9.py
      - run: python scripts/verify_phase10.py
      - run: python scripts/verify_phase11.py
      - run: python scripts/verify_phase12a.py
      - run: python scripts/verify_phase12b.py
      - run: python scripts/verify_phase12c.py
      - run: python scripts/verify_phase12d.py
      - run: python scripts/verify_phase12e.py
      - run: python scripts/verify_phase12f.py
      - run: python -m luna --version
      - run: python -m luna status
      - run: python -m luna checkpoint-smoke
      - run: python -m luna memory-smoke
      - run: python -m luna phase10-smoke
      - run: python -m luna phase11-smoke
      - run: python -m luna phase12a-smoke
      - run: python -m luna phase12b-smoke
      - run: python -m luna phase12c-smoke
      - run: python -m luna phase12d-smoke
      - run: python -m luna phase12e-smoke
      - run: python -m luna phase12f-smoke
